spring.application.name=presentation

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/presentation_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

claude.api-key=${CLAUDE_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-sonnet-5}
claude.base-url=${CLAUDE_BASE_URL:https://api.anthropic.com/v1/messages}
claude.version=${CLAUDE_VERSION:2023-06-01}
claude.max-tokens=${CLAUDE_MAX_TOKENS:4096}
