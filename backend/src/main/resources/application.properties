spring.application.name=presentation

spring.config.import=optional:file:.env[.properties]

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/presentation_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
groq.max-tokens=${GROQ_MAX_TOKENS:4096}
